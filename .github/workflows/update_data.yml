name: Update Trade Intelligence Data

on:
  schedule:
    # Runs every Sunday at 00:00 UTC (automated weekly refresh)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows one-click manual execution from the GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-trade-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run India Trade Intelligence Pipeline
        run: |
          python india_trade_intelligence/run_pipeline.py

      - name: Run Validation Tests
        run: |
          python -m pytest india_trade_intelligence/tests/ -v

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage SQLite database and processed/raw datasets
          git add india_trade_intelligence/data/
          
          # Check if there are any changes to commit
          if git diff --staged --quiet; then
            echo "No data changes detected. Database is already up to date."
          else
            git commit -m "Automated Data Update: Synchronize World Bank, DGCI&S, and RBI Data [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
